name: APK Impressora POS-5820

on:
  push:
    paths:
      - 'pos5820-app/**'
      - '.github/workflows/pos5820-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos5820-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk POS5820-Impressora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: POS5820-Impressora
          path: pos5820-app/POS5820-Impressora.apk

      - name: Publicar em Releases (download direto no celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=pos5820-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Impressora POS-5820 (APK Android)" \
              --notes "App Android para a impressora térmica POS-5820 (58mm, Bluetooth). Baixe o arquivo POS5820-Impressora.apk no celular e instale."
          fi
          gh release upload "$TAG" POS5820-Impressora.apk --clobber
