plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fernandoazevedo.pos5820'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fernandoazevedo.pos5820'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Chave fixa de debug: permite instalar versões novas por cima da antiga
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
